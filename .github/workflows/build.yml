name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The homeassistant time source takes no timezone of its own, so ESPHome bakes
  # the build machine's in as its initial one. Pin the runner to keep builds
  # identical.
  TZ: Etc/UTC

jobs:
  discover:
    name: Discover configs
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.list.outputs.configs }}
    steps:
      - uses: actions/checkout@v4

      - name: List device configs
        id: list
        run: |
          configs=$(find . -maxdepth 1 -name '*.yaml' -not -name '.*' -printf '%P\n' | sort |
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Found: $configs"
          if [ "$configs" = "[]" ]; then
            echo "No device configs found" >&2
            exit 1
          fi
          echo "configs=$configs" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.config }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.discover.outputs.configs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ESPHome
        run: pip install -r requirements.txt

      # The ESP-IDF toolchain is ~2 GB and identical across configs, so key the
      # cache on the ESPHome pin rather than on the config being built.
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: toolchains-${{ hashFiles('requirements.txt') }}
          restore-keys: toolchains-

      # The WiFi config reads !secret and secrets.yaml is gitignored; the
      # template's fallback AP values only need to be syntactically valid.
      - name: Seed secrets.yaml
        run: cp secrets.yaml.example secrets.yaml

      - name: Compile
        run: esphome compile "${{ matrix.config }}"

  dist:
    name: Check dist/ is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ESPHome
        run: pip install -r requirements.txt

      # The WiFi config reads !secret and secrets.yaml is gitignored; the
      # template's fallback AP values only need to be syntactically valid.
      - name: Seed secrets.yaml
        run: cp secrets.yaml.example secrets.yaml

      # dist/ is generated and committed; a stale copy would be served to the
      # ESPHome Builder long after the source configs moved on.
      - name: Verify generated configs
        run: python scripts/build-dist.py --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pre-commit
        run: pip install -r requirements-dev.txt

      - name: Cache hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # build-dist is the dist job's business, and the one hook that would drag
      # a full esphome install in here.
      - name: Run hooks
        env:
          SKIP: build-dist
        run: pre-commit run --all-files --show-diff-on-failure
