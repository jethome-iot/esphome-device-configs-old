substitutions:
  name: "jxd-pm220-e1eth"
  friendly_name: JXD-PM220-E1ETH
  device_description: JXD-PM220-E1ETH v1.0
  version: 1.0.0
  timezone: GMT

packages:
  main: !include ../include/jxd-pm220-e1eth-base.yaml
  energy: !include ../include/jxd-pm220-energy.yaml
  wifi: !include ../include/wifi.yaml
  display: !include ../include/jxd-pm220-e1eth-display.yaml
  # Not yet: jxd-r6-wifi-menu-items.yaml uses IPAddress::str(), removed in ESPHome 2026.8
  # wifi_menu: !include ../include/jxd-r6-wifi-menu-items.yaml
  buttons: !include ../include/jxd-r6-e1eth-buttons.yaml

esphome:
  name: ${name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  project:
    name: JetHub.JXD PM220-E1ETH
    version: ${version}
  on_boot:
    priority: 600
    then:
      - script.execute: set_wifi_ap
      - delay: 200ms
      - script.execute: setup_time

external_components:
  - source:
      type: local
      path: ../components
    components: [display_menu_base, graphical_display_menu]

http_request:

ota:
  - platform: http_request
    id: ota_http_request

dashboard_import:
  package_import_url: github://jethome-iot/esphome-configs/JXD/jxd-pm220-e1eth-wifi.yaml@master
  import_full_config: true
