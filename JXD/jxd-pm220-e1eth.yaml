substitutions:
  name: "jxd-pm220-e1eth"
  friendly_name: JXD-PM220-E1ETH
  device_description: JXD-PM220-E1ETH v1.0
  version: 1.0.0
  timezone: GMT

packages:
  main: !include ../include/jxd-pm220-e1eth-base.yaml
  energy: !include ../include/jxd-pm220-energy.yaml
  # Ethernet and WiFi, switched at run time by the Network mode select
  network: !include ../include/network.yaml
  display: !include ../include/jxd-pm220-e1eth-display.yaml
  network_menu: !include ../include/network-menu-items.yaml
  buttons: !include ../include/jxd-r6-e1eth-buttons.yaml

esphome:
  name: ${name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  project:
    name: JetHub.JXD PM220-E1ETH
    version: ${version}
  # A list, so it joins the on_boot of network.yaml rather than replacing it
  on_boot:
    - priority: 600
      then:
        - delay: 200ms
        - script.execute: setup_time

external_components:
  - source:
      type: local
      path: ../components
    components: [display_menu_base, graphical_display_menu]

http_request:

ota:
  - platform: http_request
    id: ota_http_request

dashboard_import:
  package_import_url: github://jethome-iot/esphome-configs/JXD/jxd-pm220-e1eth.yaml@master
  import_full_config: true
