substitutions:
  friendly_name: JXD-PM380-E1ETH
  lowercase_name: jxd-pm380-e1eth
  device_description: JXD-PM380-E1ETH v1.0
  version: 1.0.0
  # Paths relative to this file.
  boards: ../include/boards
  features: ../include/features

packages:
  # The CPU board and its features, as in esphome-device-configs.
  board: !include ${boards}/jxd-cpu-e1eth.yaml
  display_off: !include ${features}/display-off.yaml
  i2c: !include ${features}/i2c.yaml
  rtc_time: !include ${features}/rtc-time.yaml
  vin_measure: !include ${features}/vin-measure.yaml

  jxd-d3-pm3-3: !include ../include/jxd-d3-pm3-3.yaml
  energy: !include ../include/jxd-pm380-energy.yaml
  # Ethernet and WiFi, switched at run time by the Network mode select
  network: !include ../include/network.yaml
  jxd-pm380-e1eth-display: !include ../include/jxd-pm380-e1eth-display.yaml
  network_menu: !include ../include/network-menu-items.yaml
  jxd-r6-e1eth-buttons: !include ../include/jxd-r6-e1eth-buttons.yaml

esphome:
  name: ${lowercase_name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  project:
    name: JetHub.JXD PM380-E1ETH
    version: ${version}
  # A list, so it joins the on_boot of network.yaml rather than replacing it
  on_boot:
    - priority: 600
      then:
        - switch.turn_on: red_led
        - delay: 300ms
        - switch.turn_off: red_led
    # Restores the stored timezone and reads the RTC once I2C is up.
    - priority: 600
      then:
        - delay: 200ms
        - script.execute: setup_time

# Enable logging
logger:
  level: VERBOSE
  initial_level: DEBUG
  logs:
    text_sensor: NONE
    sensor: NONE
    adc.common: WARN
    pca9554: WARN
    atm90e32: VERBOSE

# API, OTA and the web server come with the board package, Network and System groups too
web_server:
  sorting_groups:
    - id: phase_l1
      name: "Phase L1"
      sorting_weight: 1
    - id: phase_l2
      name: "Phase L2"
      sorting_weight: 2
    - id: phase_l3
      name: "Phase L3"
      sorting_weight: 3
    - id: mains
      name: "Mains"
      sorting_weight: 4
    - id: energy
      name: "Energy"
      sorting_weight: 20
    - id: calibration
      name: "Calibration"
      sorting_weight: 25

external_components:
  - source:
      type: local
      path: ../components
    components: [display_menu_base, graphical_display_menu]
  # - source:
  #     type: git
  #     url: https://github.com/jethome-iot/esphome
  #     ref: dev-jethub
  #   components: [wifi, ethernet]

dashboard_import:
  package_import_url: github://jethome-iot/esphome-configs/JXD/jxd-pm380-e1eth.yaml@master
  import_full_config: true

# i2c_eeprom and the CPU board EEPROM eeprom_cpu come with the board package
i2c_eeprom:
# peripheral board eeprom
  - id: eeprom_per
    size: 64KB # size in Kbits
    address: 0x56
# cpu board fram
  - id: fram_cpu
    size: 64KB # size in Kbits
    address: 0x52
