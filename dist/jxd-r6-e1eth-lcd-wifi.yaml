# Generated by scripts/build-dist.py — do not edit.
#
# Self-contained build of jxd-r6-e1eth-lcd-wifi.yaml, served to the ESPHome Builder by
# dashboard_import. Edit the source config and its packages, then regenerate.

esp32:
  board: esp32dev
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SPEED: y
      CONFIG_D0WD_PSRAM_CLK_IO: '6'
psram:
  mode: quad
  speed: 80MHz
api:
  encryption: null
  reboot_timeout: 15min
ota:
  - platform: esphome
preferences:
  flash_write_interval: 5s
logger:
  level: debug
web_server:
  port: 80
sensor:
  - platform: tmp102
    name: PCB Temp
    id: pcb_temp
    update_interval: 20s
    entity_category: diagnostic
  - platform: dallas_temp
    name: Temp1
    id: temperature_sensor
    update_interval: 20s
  - platform: adc
    name: VIN voltage
    id: vin_meas
    pin: GPIO35
    attenuation: 2.5dB
    accuracy_decimals: 2
    entity_category: diagnostic
    internal: true
    update_interval: 100ms
    filters:
      - multiply: 32.0
      - median:
          window_size: 20
          send_every: 20
          send_first_at: 10
      - clamp:
          min_value: 0
      - lambda: 'if (x <= 2.8) return 0;

          return x;'
  - platform: adc
    name: PoE voltage
    id: poe_voltage
    pin: GPIO37
    attenuation: 2.5dB
    accuracy_decimals: 2
    entity_category: diagnostic
    internal: true
    update_interval: 100ms
    filters:
      - multiply: 32.0
      - median:
          window_size: 20
          send_every: 20
          send_first_at: 10
      - clamp:
          min_value: 0
      - lambda: 'if (x <= 2.8) return 0;

          return x;'
  - platform: template
    id: input_voltage
    internal: true
    update_interval: 1s
    lambda: return std::max(id(vin_meas).state, id(poe_voltage).state);
switch:
  - platform: gpio
    name: Red led
    id: red_led
    pin: GPIO2
  - platform: gpio
    name: Relay 1
    id: relay_1
    pin:
      pca9554: jxd_d6_r6_exp
      number: 0
      mode:
        output: true
  - platform: gpio
    name: Relay 2
    id: relay_2
    pin:
      pca9554: jxd_d6_r6_exp
      number: 1
      mode:
        output: true
  - platform: gpio
    name: Relay 3
    id: relay_3
    pin:
      pca9554: jxd_d6_r6_exp
      number: 2
      mode:
        output: true
  - platform: gpio
    name: Relay 4
    id: relay_4
    pin:
      pca9554: jxd_d6_r6_exp
      number: 3
      mode:
        output: true
  - platform: gpio
    name: Relay 5
    id: relay_5
    pin:
      pca9554: jxd_d6_r6_exp
      number: 4
      mode:
        output: true
  - platform: gpio
    name: Relay 6
    id: relay_6
    pin:
      pca9554: jxd_d6_r6_exp
      number: 5
      mode:
        output: true
binary_sensor:
  - platform: gpio
    name: FN button
    id: fn_button
    internal: true
    pin:
      number: GPIO0
      inverted: true
  - platform: gpio
    name: Input 1
    id: input_1
    pin:
      pca9554: jxd_d6_r6_exp
      number: 8
      mode:
        input: true
  - platform: gpio
    name: Input 2
    id: input_2
    pin:
      pca9554: jxd_d6_r6_exp
      number: 9
      mode:
        input: true
  - platform: gpio
    name: Input 3
    id: input_3
    pin:
      pca9554: jxd_d6_r6_exp
      number: 10
      mode:
        input: true
  - platform: gpio
    name: Input 4
    id: input_4
    pin:
      pca9554: jxd_d6_r6_exp
      number: 11
      mode:
        input: true
  - platform: gpio
    name: Input 5
    id: input_5
    pin:
      pca9554: jxd_d6_r6_exp
      number: 12
      mode:
        input: true
  - platform: gpio
    name: Input 6
    id: input_6
    pin:
      pca9554: jxd_d6_r6_exp
      number: 13
      mode:
        input: true
  - platform: gpio
    name: UP
    id: up_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 8
      mode:
        input: true
    on_press:
      - display_menu.up: null
      - script.execute: check_blank_page
  - platform: gpio
    name: DOWN
    id: down_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 9
      mode:
        input: true
    on_press:
      - display_menu.down: null
      - script.execute: check_blank_page
  - platform: gpio
    name: LEFT
    id: left_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 10
      mode:
        input: true
    on_press:
      - lambda: "auto *page = id(display1).get_active_page();\nif (id(display_menu).is_active())\
          \ {\n  id(display_menu).left();\n} else if (page == id(main_page) || page\
          \ == id(blank_page)) {\n  id(status_relay_sel) = 0;\n  id(display1).show_page(id(status_page));\n\
          } else if (page == id(status_page) && !id(relays).empty()) {\n  int n =\
          \ id(relays).size();\n  id(status_relay_sel) = (id(status_relay_sel) + n\
          \ - 1) % n;\n  id(display1).update();\n}"
      - script.execute: check_blank_page
  - platform: gpio
    name: RIGHT
    id: right_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 11
      mode:
        input: true
    on_press:
      - lambda: "auto *page = id(display1).get_active_page();\nif (id(display_menu).is_active())\
          \ {\n  id(display_menu).right();\n} else if (page == id(main_page) || page\
          \ == id(blank_page)) {\n  id(display1).show_page(id(time_page));\n} else\
          \ if (page == id(status_page) && !id(relays).empty()) {\n  int n = id(relays).size();\n\
          \  id(status_relay_sel) = (id(status_relay_sel) + 1) % n;\n  id(display1).update();\n\
          }"
      - script.execute: check_blank_page
  - platform: gpio
    name: CENTER
    id: center_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 12
      mode:
        input: true
    on_press:
      - lambda: "auto *page = id(display1).get_active_page();\nif (id(display_menu).is_active())\
          \ {\n  id(display_menu).enter();\n} else if (page == id(main_page)) {\n\
          \  id(display_menu).show_main();\n} else if (page == id(status_page)) {\n\
          \  int sel = id(status_relay_sel);\n  if (sel >= 0 && sel < (int) id(relays).size())\
          \ {\n    id(relays)[sel]->toggle();\n    id(display1).update();\n  }\n}"
      - script.execute: check_blank_page
  - platform: gpio
    name: HOME
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 13
      mode:
        input: true
    on_press:
      - lambda: "if (id(display1).get_active_page() != id(main_page)) {\n  id(display_menu).hide();\n\
          \  id(display1).show_page(id(main_page));\n}"
      - script.execute: check_blank_page
  - platform: gpio
    name: BACK
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 14
      mode:
        input: true
    on_press:
      - lambda: "auto *page = id(display1).get_active_page();\nif (id(display_menu).is_active())\
          \ {\n  if (id(menu_at_root)) {\n    id(display_menu).hide();\n    id(display1).show_page(id(main_page));\n\
          \  } else {\n    id(display1).show_page(id(main_page));\n    id(display_menu).show_main();\n\
          \  }\n} else if (page == id(blank_page)) {\n  id(display_off_s) = 0;\n \
          \ id(display1).show_page(id(main_page));\n} else if (page == id(main_page))\
          \ {\n  id(display1).show_page(id(blank_page));\n} else {\n  id(display1).show_page(id(main_page));\n\
          }"
text_sensor:
  - platform: uptime
    name: Uptime
    id: uptime_sensor
    internal: true
    format:
      separator: ' '
  - platform: wifi_info
    ip_address:
      name: WiFi IP
      id: ip
    mac_address:
      name: WiFi MAC
      id: mac_wifi
pca9554:
  - id: jxd_d6_r6_exp
    pin_count: 16
    address: 34
  - id: jxd_display_exp
    pin_count: 16
    address: 36
one_wire:
  - platform: ds2484
    id: one_wire_bus
    address: 24
    active_pullup: true
globals:
  - id: relays
    type: std::vector<switch_::Switch *>
  - id: inputs
    type: std::vector<binary_sensor::BinarySensor *>
  - id: temperatures
    type: std::vector<sensor::Sensor *>
  - id: display_off_threshold_s
    type: uint32_t
  - id: display_off_s
    type: uint32_t
  - id: status_relay_sel
    type: int
    initial_value: '0'
  - id: menu_at_root
    type: bool
    initial_value: 'true'
esphome:
  on_boot:
    - priority: 800
      then:
        - lambda: "id(relays) = {id(relay_1), id(relay_2), id(relay_3),\n        \
            \      id(relay_4), id(relay_5), id(relay_6)};\nid(inputs) = {id(input_1),\
            \ id(input_2), id(input_3),\n              id(input_4), id(input_5), id(input_6)};"
    - priority: 800
      then:
        - lambda: id(temperatures) = {id(temperature_sensor)};
    - priority: 600
      then:
        - delay: 200ms
        - script.execute: setup_time
  name: ${name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  project:
    name: JetHub.JXD R6-E1ETH-LCD
    version: ${version}
i2c:
  - id: i2c1
    sda: 5
    scl: 4
    frequency: 400kHz
    scan: true
uart:
  - id: jxm_uart1
    tx_pin: GPIO33
    rx_pin: GPIO34
    baud_rate: 9600
    stop_bits: 1
  - id: jxm_uart2
    tx_pin: GPIO32
    rx_pin: GPIO39
    baud_rate: 9600
    stop_bits: 1
time:
  - platform: sntp
    id: sntp_time
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        pcf8563.write_time: null
  - platform: pcf8563
    id: pcf8563_time
    address: 81
    timezone: ${timezone}
    update_interval: 15min
script:
  - id: setup_time
    then:
      - pcf8563.read_time:
          id: pcf8563_time
  - id: check_blank_page
    then:
      - lambda: "id(display_off_s) = 0;\nif (id(display1).get_active_page() == id(blank_page))\
          \ {\n  id(display1).show_page(id(main_page));\n}"
  - id: reset_wifi
    then:
      - logger.log: Reset WiFi creds
      - lambda: 'id(wifi_id).save_wifi_sta("", "");

          App.safe_reboot();'
modbus:
  - id: modbus_bus
    uart_id: jxm_uart2
    role: server
modbus_server:
  - id: modbus_server1
    modbus_id: modbus_bus
    address: 1
    courtesy_response:
      enabled: true
    bits:
      - address: 0
        read_lambda: return id(relay_1).state;
        write_lambda: "if (x) {\n  id(relay_1).turn_on();\n} else {\n  id(relay_1).turn_off();\n\
          }\nreturn true;"
      - address: 1
        read_lambda: return id(relay_2).state;
        write_lambda: "if (x) {\n  id(relay_2).turn_on();\n} else {\n  id(relay_2).turn_off();\n\
          }\nreturn true;"
      - address: 2
        read_lambda: return id(relay_3).state;
        write_lambda: "if (x) {\n  id(relay_3).turn_on();\n} else {\n  id(relay_3).turn_off();\n\
          }\nreturn true;"
      - address: 3
        read_lambda: return id(relay_4).state;
        write_lambda: "if (x) {\n  id(relay_4).turn_on();\n} else {\n  id(relay_4).turn_off();\n\
          }\nreturn true;"
      - address: 4
        read_lambda: return id(relay_5).state;
        write_lambda: "if (x) {\n  id(relay_5).turn_on();\n} else {\n  id(relay_5).turn_off();\n\
          }\nreturn true;"
      - address: 5
        read_lambda: return id(relay_6).state;
        write_lambda: "if (x) {\n  id(relay_6).turn_on();\n} else {\n  id(relay_6).turn_off();\n\
          }\nreturn true;"
      - address: 16
        read_lambda: return id(input_1).state;
      - address: 17
        read_lambda: return id(input_2).state;
      - address: 18
        read_lambda: return id(input_3).state;
      - address: 19
        read_lambda: return id(input_4).state;
      - address: 20
        read_lambda: return id(input_5).state;
      - address: 21
        read_lambda: return id(input_6).state;
select:
  - platform: template
    id: display_off_timer_select
    optimistic: true
    internal: true
    restore_value: true
    initial_option: 5m
    options:
      - 5m
      - 10m
      - 15m
      - never
    on_value:
      then:
        - lambda: 'const uint32_t MINUTES[] = {5, 10, 15, 0};

            id(display_off_threshold_s) = MINUTES[i] * 60;

            id(display_off_s) = 0;'
interval:
  - interval: 1s
    then:
      - lambda: "if (id(display_off_threshold_s) == 0)\n  return;\n\nif (id(display_off_s)\
          \ >= id(display_off_threshold_s)) {\n  id(display_menu).hide();\n  id(display1).show_page(id(blank_page));\n\
          } else {\n  id(display_off_s)++;\n}"
font:
  - file: https://raw.githubusercontent.com/jethome-iot/esphome-device-configs/refactor/simplify-configs/fonts/7x14-mod2.bdf
    id: f7x14_mod2
  - file: https://raw.githubusercontent.com/jethome-iot/esphome-device-configs/refactor/simplify-configs/fonts/6x12.bdf
    id: f6x12
  - file: https://raw.githubusercontent.com/jethome-iot/esphome-device-configs/refactor/simplify-configs/fonts/5x7.bdf
    id: f5x7
  - file: https://raw.githubusercontent.com/jethome-iot/esphome-device-configs/refactor/simplify-configs/fonts/spleen-12x24.bdf
    id: big_label_font
display:
  - platform: ssd1306_i2c
    id: display1
    model: SH1106_128X64
    address: 60
    update_interval: 200ms
    pages:
      - id: main_page
        lambda: 'uint8_t mac[6];

          get_mac_address_raw(mac);

          auto str_name = "${friendly_name}-" + str_snprintf("%02X%02X", 4, mac[4],
          mac[5]);


          const int row_size = 15;

          int y = (64 - row_size * 4) / 2;


          it.printf(0, y, id(f6x12), "%s", str_name.c_str());

          y += row_size;

          it.printf(0, y, id(f6x12), "UP: %s", id(uptime_sensor).state.c_str());

          y += row_size;

          it.printf(0, y, id(f6x12), "VIN: %2.1fV", id(input_voltage).state);

          y += row_size;

          it.printf(0, y, id(f6x12), "IP: %s", id(ip).state.c_str());'
  - platform: ssd1306_i2c
    id: !extend 'display1'
    pages:
      - id: status_page
        lambda: "const auto black = Color(0, 0, 0);\nconst int radius = 4;\nconst\
          \ int x_spacing = 15;\nconst int x_start = 5;\n\nit.print(0, 0, id(f5x7),\
          \ \"Relays\");\nint x = x_start;\nfor (size_t i = 0; i < id(relays).size();\
          \ i++) {\n  if (id(relays)[i]->state) {\n    it.filled_circle(x, 15, radius);\n\
          \  } else {\n    it.circle(x, 15, radius);\n  }\n  if ((int) i == id(status_relay_sel))\
          \ {\n    it.filled_rectangle(x - 3, 21, 7, 9);\n    it.printf(x - 2, 22,\
          \ id(f5x7), black, \"%d\", (int) i + 1);\n  } else {\n    it.printf(x -\
          \ 2, 22, id(f5x7), \"%d\", (int) i + 1);\n  }\n  x += x_spacing;\n}\n\n\
          it.print(0, 32, id(f5x7), \"Inputs\");\nx = x_start;\nint num = 1;\nfor\
          \ (auto *input : id(inputs)) {\n  if (input->state) {\n    it.filled_circle(x,\
          \ 47, radius);\n  } else {\n    it.circle(x, 47, radius);\n  }\n  it.printf(x\
          \ - 2, 54, id(f5x7), \"%d\", num++);\n  x += x_spacing;\n}\n\nit.print(92,\
          \ 0, id(f5x7), \"Temp\");\nint y = 11;\nfor (auto *sensor : id(temperatures))\
          \ {\n  it.printf(92, y, id(f5x7), \"%.7s\", sensor->get_name().c_str());\n\
          \  y += 8;\n  if (sensor->has_state()) {\n    it.printf(92, y, id(f5x7),\
          \ \"%.1f\", sensor->state);\n  } else {\n    it.print(92, y, id(f5x7), \"\
          --.-\");\n  }\n  y += 11;\n}"
  - platform: ssd1306_i2c
    id: !extend 'display1'
    pages:
      - id: time_page
        lambda: "const auto width = it.get_width();\nconst auto height = it.get_height();\n\
          it.strftime(width / 2, height / 2 - 12, id(big_label_font), TextAlign::CENTER,\n\
          \            \"%H:%M:%S\", id(pcf8563_time).now());\nit.strftime(width /\
          \ 2, height / 2 + 8, id(f7x14_mod2), TextAlign::CENTER,\n            \"\
          %a, %b %d\", id(pcf8563_time).now());"
  - platform: ssd1306_i2c
    id: !extend 'display1'
    pages:
      - id: blank_page
        lambda: return;
graphical_display_menu:
  id: display_menu
  display: display1
  font: f7x14_mod2
  mode: joystick
  active: false
  on_enter:
    - lambda: id(menu_at_root) = true;
  on_leave:
    - lambda: id(menu_at_root) = false;
  on_redraw:
    then:
      - component.update: display1
  items:
    - type: menu
      text: Relays
      items:
        - type: switch
          text: Relay 1
          switch: relay_1
          immediate_edit: true
        - type: switch
          text: Relay 2
          switch: relay_2
          immediate_edit: true
        - type: switch
          text: Relay 3
          switch: relay_3
          immediate_edit: true
        - type: switch
          text: Relay 4
          switch: relay_4
          immediate_edit: true
        - type: switch
          text: Relay 5
          switch: relay_5
          immediate_edit: true
        - type: switch
          text: Relay 6
          switch: relay_6
          immediate_edit: true
    - type: menu
      text: Inputs
      items:
        - type: label
          text: !lambda |-
            return id(input_1).state ? "Input 1: ON" : "Input 1: OFF";
        - type: label
          text: !lambda |-
            return id(input_2).state ? "Input 2: ON" : "Input 2: OFF";
        - type: label
          text: !lambda |-
            return id(input_3).state ? "Input 3: ON" : "Input 3: OFF";
        - type: label
          text: !lambda |-
            return id(input_4).state ? "Input 4: ON" : "Input 4: OFF";
        - type: label
          text: !lambda |-
            return id(input_5).state ? "Input 5: ON" : "Input 5: OFF";
        - type: label
          text: !lambda |-
            return id(input_6).state ? "Input 6: ON" : "Input 6: OFF";
    - type: menu
      text: Temperatures
      items:
        - type: label
          text: !lambda |-
            return str_sprintf("%s: %2.1f°C", id(temperature_sensor).get_name().c_str(),
                               id(temperature_sensor).state);
    - type: menu
      text: Info
      id: info_submenu
      items: null
    - type: menu
      text: Settings
      id: menu_settings_id
      items:
        - type: select
          text: Display off
          select: display_off_timer_select
        - type: menu
          text: Factory reset
          items:
            - type: label
              text: Factory reset?
            - type: command
              text: Confirm
              on_value:
                - lambda: 'global_preferences->reset();

                    App.safe_reboot();'
        - type: command
          text: Reboot device
          on_value:
            - lambda: App.safe_reboot();
    - id: !extend 'info_submenu'
      items:
        - type: label
          text: 'IP(WiFi):'
        - type: label
          text: !lambda |-
            if (id(captive_portal_id).is_active()) {
              char buf[esphome::network::IP_ADDRESS_BUFFER_SIZE];
              return " " + std::string(id(wifi_id).wifi_soft_ap_ip().str_to(buf));
            }
            return " " + id(ip).state;
        - type: label
          text: 'MAC:'
        - type: label
          text: !lambda |-
            return " " + id(mac_wifi).state;
    - id: !extend 'menu_settings_id'
      items:
        - type: menu
          text: Reset WiFi creds
          items:
            - type: label
              text: Reset?
            - type: command
              text: Confirm
              id: wifi_reset_yes
              on_value:
                - lambda: id(wifi_reset_yes)->set_text("Confirm - OK");
                - delay: 1s
                - script.execute: reset_wifi
wifi:
  id: wifi_id
  reboot_timeout: 5min
  ap:
    ssid: !secret 'wifi_ap_ssid'
    password: !secret 'wifi_password_ssid'
captive_portal:
  id: captive_portal_id
dashboard_import:
  package_import_url: github://jethome-iot/esphome-device-configs/dist/jxd-r6-e1eth-lcd-wifi.yaml@refactor/simplify-configs
  import_full_config: true
substitutions:
  timezone: ''
  name: jxd-r6-e1eth-lcd-wifi
  friendly_name: JXD-R6-E1ETH-LCD
  version: 1.0.0
