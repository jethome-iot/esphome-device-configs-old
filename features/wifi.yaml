wifi:
  id: wifi_id
  reboot_timeout: 5min
  ap:
    ap_timeout: 5s
    ssid: !secret wifi_ap_ssid
    password: !secret wifi_password_ssid

captive_portal:
  id: captive_portal_id

script:
  - id: reset_wifi
    then:
      - logger.log: 'Reset WiFi creds'
      - lambda: |-
          id(wifi_id).save_wifi_sta("", "");
          App.safe_reboot();

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "WiFi IP"
      id: ip
    mac_address:
      name: "WiFi MAC"
      id: mac_wifi
