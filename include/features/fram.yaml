# Here: from esphome-device-configs, branch feature/fram-store,
# devices/JXD/packages/features/fram.yaml (layout v1). Every deviation from it is marked "Here:".
#
# The CPU board's FRAM (FM24CL64B at 0x52, 8 KiB, WP grounded) and the stores the meters keep
# their state in. Details: components/fram_store/README.md
# Here: PM220 and PM380 include it (there: "No device includes this package yet."). What they
# keep in fram_store_counters is listed in components/pm_energy/pm_energy.h.
#
# One store per life cycle, each formatting only its own range. A shipped store never changes:
# changing a region's id, kind or size, adding one or removing one empties that store on every
# device that boots the firmware. New data goes into a new store in the spare; a store that has
# to change moves to a new base in the spare, and its old range stays reserved for as long as a
# rollback target still uses it. tests/components/fram_store/test_schema.py pins all of it.
#
#   0x0000-0x01FF  the factory station's; never read or written here
#   0x0200-0x06BF  fram_store_meter, frozen for good
#     0x0200         superblock, 32 B
#     0x0220         fram_meter_board   slot 64 B: which metering board the energy belongs to
#     0x02B0         fram_odometers     slot 512 B: lifetime energy per channel and direction
#   0x06C0-0x0DDF  fram_store_counters
#     0x06C0         superblock, 32 B
#     0x06E0         fram_counter_00-15 slots 48 B: the state of each user counter
#   0x0DE0-0x1FFF  spare, 4640 B, declared by no store
#
# Here: in 0x0000-0x01FF the self-test of tests/test-i2c.yaml writes its byte at 0x0001, and
# the PM firmware before fram_store left its own counter records at 0x0100 and 0x0180; nothing
# reads them any more.
external_components:
  - source: ${components}
    components: [fram_store]

i2c_eeprom:
  - id: fram_cpu
    size: 64KB
    type: fram
    address: 0x52

fram_store:
  - id: fram_store_meter
    eeprom_id: fram_cpu
    size: 8192
    base_offset: 0x0200
    regions:
      - {id: fram_meter_board, type: slot, size: 64}
      - {id: fram_odometers, type: slot, size: 512}
  - id: fram_store_counters
    eeprom_id: fram_cpu
    size: 8192
    base_offset: 0x06C0
    regions:
      - {id: fram_counter_00, type: slot, size: 48}
      - {id: fram_counter_01, type: slot, size: 48}
      - {id: fram_counter_02, type: slot, size: 48}
      - {id: fram_counter_03, type: slot, size: 48}
      - {id: fram_counter_04, type: slot, size: 48}
      - {id: fram_counter_05, type: slot, size: 48}
      - {id: fram_counter_06, type: slot, size: 48}
      - {id: fram_counter_07, type: slot, size: 48}
      - {id: fram_counter_08, type: slot, size: 48}
      - {id: fram_counter_09, type: slot, size: 48}
      - {id: fram_counter_10, type: slot, size: 48}
      - {id: fram_counter_11, type: slot, size: 48}
      - {id: fram_counter_12, type: slot, size: 48}
      - {id: fram_counter_13, type: slot, size: 48}
      - {id: fram_counter_14, type: slot, size: 48}
      - {id: fram_counter_15, type: slot, size: 48}
