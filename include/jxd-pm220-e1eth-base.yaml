substitutions: #defaults
  name: "jxd-pm220-e1eth"
  friendly_name: JXD-PM220-E1ETH
  device_description: JXD-PM220-E1ETH v1.0
  timezone: GMT
  # The module divides mains with 4x20k, the ESPHome BL0906 constants assume 5x20k:
  # voltage, power and energy all read 1.25 times high
  divider_correction: "0.8"

packages:
  time: !include ../include/pcf8563-time.yaml
  vin_measure: !include ../include/jxd-r6-vin-measure.yaml

api:
  encryption:
  reboot_timeout: 0min
  on_client_connected:
    - lambda: |-
        id(ha_time_source).update();

ota:
  - platform: esphome

preferences:
  flash_write_interval: 5s

esp32:
  board: esp32dev
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SPEED: y
      CONFIG_D0WD_PSRAM_CLK_IO: "6"
      CONFIG_D0WD_PSRAM_CS_IO: "16"

psram:
  mode: quad
  speed: 80MHz

# Enable logging
logger:
  level: debug
  logs:
    esp-idf: INFO
    wifi: INFO

# Enable built-in web server
web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: mains
      name: "Mains"
      sorting_weight: 1
    - id: channel_1
      name: "Channel 1"
      sorting_weight: 11
    - id: channel_2
      name: "Channel 2"
      sorting_weight: 12
    - id: channel_3
      name: "Channel 3"
      sorting_weight: 13
    - id: channel_4
      name: "Channel 4"
      sorting_weight: 14
    - id: channel_5
      name: "Channel 5"
      sorting_weight: 15
    - id: channel_6
      name: "Channel 6"
      sorting_weight: 16
    - id: energy
      name: "Energy"
      sorting_weight: 20
    - id: group_network
      name: "Network"
      sorting_weight: 30
    - id: device
      name: "Device"
      sorting_weight: 40

external_components:
  - source: github://pilotak/esphome-eeprom
    components: [i2c_eeprom]

i2c:
  sda: 5
  scl: 4
  frequency: 400kHz
  scan: true
  id: i2c1
  timeout: 100ms

i2c_eeprom:
# peripheral board eeprom
  - id: eeprom_per
    size: 64KB # size in Kbits
    address: 0x56
# cpu board eeprom
  - id: eeprom_cpu
    size: 64KB # size in Kbits
    address: 0x54
# cpu board fram
  - id: fram_cpu
    size: 64KB # size in Kbits
    address: 0x52

# BL0906 behind the SCM3725ASA isolator. Its RESET follows GPIO32 through an optocoupler
# (high holds the chip in reset), so GPIO32 is left alone.
uart:
  tx_pin: GPIO33
  rx_pin: GPIO34
  baud_rate: 19200

sensor:
  # Channel energy is the chip pulse counter in kWh: not cleared on read, it restarts only
  # with the chip itself, not with the ESP. It only feeds the counters in jxd-pm220-energy.yaml,
  # so it stays out of HA.
  - platform: bl0906
    # The 60 s default is too slow for the screen
    update_interval: 5s
    frequency:
      name: 'Frequency'
      id: line_frequency
      web_server:
        sorting_group_id: mains
        sorting_weight: 2
    temperature:
      name: 'Temperature'
      id: bl0906_temperature
      web_server:
        sorting_group_id: mains
        sorting_weight: 4
    voltage:
      name: 'Voltage'
      id: line_voltage
      web_server:
        sorting_group_id: mains
        sorting_weight: 1
      filters:
        - multiply: ${divider_correction}
    channel_1:
      current:
        name: 'Current_1'
        id: current_1
        web_server:
          sorting_group_id: channel_1
          sorting_weight: 1
      power:
        name: 'Power_1'
        id: power_1
        web_server:
          sorting_group_id: channel_1
          sorting_weight: 2
        filters:
          - multiply: ${divider_correction}
      energy:
        name: 'Energy_1'
        id: energy_1
        internal: true
        filters:
          - multiply: ${divider_correction}
    channel_2:
      current:
        name: 'Current_2'
        id: current_2
        web_server:
          sorting_group_id: channel_2
          sorting_weight: 1
      power:
        name: 'Power_2'
        id: power_2
        web_server:
          sorting_group_id: channel_2
          sorting_weight: 2
        filters:
          - multiply: ${divider_correction}
      energy:
        name: 'Energy_2'
        id: energy_2
        internal: true
        filters:
          - multiply: ${divider_correction}
    channel_3:
      current:
        name: 'Current_3'
        id: current_3
        web_server:
          sorting_group_id: channel_3
          sorting_weight: 1
      power:
        name: 'Power_3'
        id: power_3
        web_server:
          sorting_group_id: channel_3
          sorting_weight: 2
        filters:
          - multiply: ${divider_correction}
      energy:
        name: 'Energy_3'
        id: energy_3
        internal: true
        filters:
          - multiply: ${divider_correction}
    channel_4:
      current:
        name: 'Current_4'
        id: current_4
        web_server:
          sorting_group_id: channel_4
          sorting_weight: 1
      power:
        name: 'Power_4'
        id: power_4
        web_server:
          sorting_group_id: channel_4
          sorting_weight: 2
        filters:
          - multiply: ${divider_correction}
      energy:
        name: 'Energy_4'
        id: energy_4
        internal: true
        filters:
          - multiply: ${divider_correction}
    channel_5:
      current:
        name: 'Current_5'
        id: current_5
        web_server:
          sorting_group_id: channel_5
          sorting_weight: 1
      power:
        name: 'Power_5'
        id: power_5
        web_server:
          sorting_group_id: channel_5
          sorting_weight: 2
        filters:
          - multiply: ${divider_correction}
      energy:
        name: 'Energy_5'
        id: energy_5
        internal: true
        filters:
          - multiply: ${divider_correction}
    channel_6:
      current:
        name: 'Current_6'
        id: current_6
        web_server:
          sorting_group_id: channel_6
          sorting_weight: 1
      power:
        name: 'Power_6'
        id: power_6
        web_server:
          sorting_group_id: channel_6
          sorting_weight: 2
        filters:
          - multiply: ${divider_correction}
      energy:
        name: 'Energy_6'
        id: energy_6
        internal: true
        filters:
          - multiply: ${divider_correction}
    total_power:
      name: 'Total_Power'
      id: total_power
      web_server:
        sorting_group_id: mains
        sorting_weight: 3
      filters:
        - multiply: ${divider_correction}

# temperature sensor
  - platform: tmp102
    id: cpu_board_temp
    address: 0x48
    name: "PCB TEMPERATURE"
    update_interval: 20s
    web_server:
      sorting_group_id: device
      sorting_weight: 1

text_sensor:
  - platform: uptime
    name: Uptime
    id: uptime_sensor
    internal: true
    format:
      separator: " "

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
    name: "FN button"
    id: fn_button
    # The firmware's button, not an entity for HA
    internal: true

switch:
  - platform: gpio
    name: "Red led"
    id: red_led
    pin: GPIO2
    # The firmware's LED, not a control for HA
    internal: true
