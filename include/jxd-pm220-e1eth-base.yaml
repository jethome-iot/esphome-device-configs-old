# The JXD-PM220 metering side: BL0906 and the peripheral board's EEPROM. The CPU board itself
# (ESP32, API, OTA, PCB Temp, FN, LED) and its features (I2C, RTC time, VIN, display off, the
# FRAM the energy counters live in) come from boards/ and features/ in the device config.
substitutions: #defaults
  name: "jxd-pm220-e1eth"
  friendly_name: JXD-PM220-E1ETH
  device_description: JXD-PM220-E1ETH v1.0
  # The module divides mains with 4x20k, the ESPHome BL0906 constants assume 5x20k:
  # voltage, power and energy all read 1.25 times high
  divider_correction: "0.8"

logger:
  logs:
    esp-idf: INFO
    wifi: INFO

# Network and System are declared by boards/jxd-cpu-e1eth.yaml
web_server:
  sorting_groups:
    - id: mains
      name: "Mains"
      sorting_weight: 1
    - id: channel_1
      name: "Channel 1"
      sorting_weight: 11
    - id: channel_2
      name: "Channel 2"
      sorting_weight: 12
    - id: channel_3
      name: "Channel 3"
      sorting_weight: 13
    - id: channel_4
      name: "Channel 4"
      sorting_weight: 14
    - id: channel_5
      name: "Channel 5"
      sorting_weight: 15
    - id: channel_6
      name: "Channel 6"
      sorting_weight: 16
    - id: energy
      name: "Energy"
      sorting_weight: 20

# i2c_eeprom (components/i2c_eeprom) and the CPU board EEPROM eeprom_cpu come with the board
# package, the CPU board FRAM fram_cpu with features/fram.yaml
i2c_eeprom:
# peripheral board eeprom
  - id: eeprom_per
    size: 64KB # size in Kbits
    address: 0x56

# BL0906 behind the SCM3725ASA isolator. Its RESET follows GPIO32 through an optocoupler
# (high holds the chip in reset), so GPIO32 is left alone.
uart:
  tx_pin: GPIO33
  rx_pin: GPIO34
  baud_rate: 19200

sensor:
  # Channel energy is the chip pulse counter in kWh: not cleared on read, it restarts only
  # with the chip itself, not with the ESP. It only feeds the counters in jxd-pm220-energy.yaml,
  # so it stays out of HA.
  - platform: bl0906
    # The 60 s default is too slow for the screen
    update_interval: 5s
    frequency:
      name: 'Frequency'
      id: line_frequency
      web_server:
        sorting_group_id: mains
        sorting_weight: 2
    temperature:
      name: 'Temperature'
      id: bl0906_temperature
      web_server:
        sorting_group_id: mains
        sorting_weight: 4
    voltage:
      name: 'Voltage'
      id: line_voltage
      web_server:
        sorting_group_id: mains
        sorting_weight: 1
      filters:
        - multiply: ${divider_correction}
    channel_1:
      current:
        name: 'Current_1'
        id: current_1
        web_server:
          sorting_group_id: channel_1
          sorting_weight: 1
      power:
        name: 'Power_1'
        id: power_1
        web_server:
          sorting_group_id: channel_1
          sorting_weight: 2
        filters:
          - multiply: ${divider_correction}
      energy:
        name: 'Energy_1'
        id: energy_1
        internal: true
        filters:
          - multiply: ${divider_correction}
    channel_2:
      current:
        name: 'Current_2'
        id: current_2
        web_server:
          sorting_group_id: channel_2
          sorting_weight: 1
      power:
        name: 'Power_2'
        id: power_2
        web_server:
          sorting_group_id: channel_2
          sorting_weight: 2
        filters:
          - multiply: ${divider_correction}
      energy:
        name: 'Energy_2'
        id: energy_2
        internal: true
        filters:
          - multiply: ${divider_correction}
    channel_3:
      current:
        name: 'Current_3'
        id: current_3
        web_server:
          sorting_group_id: channel_3
          sorting_weight: 1
      power:
        name: 'Power_3'
        id: power_3
        web_server:
          sorting_group_id: channel_3
          sorting_weight: 2
        filters:
          - multiply: ${divider_correction}
      energy:
        name: 'Energy_3'
        id: energy_3
        internal: true
        filters:
          - multiply: ${divider_correction}
    channel_4:
      current:
        name: 'Current_4'
        id: current_4
        web_server:
          sorting_group_id: channel_4
          sorting_weight: 1
      power:
        name: 'Power_4'
        id: power_4
        web_server:
          sorting_group_id: channel_4
          sorting_weight: 2
        filters:
          - multiply: ${divider_correction}
      energy:
        name: 'Energy_4'
        id: energy_4
        internal: true
        filters:
          - multiply: ${divider_correction}
    channel_5:
      current:
        name: 'Current_5'
        id: current_5
        web_server:
          sorting_group_id: channel_5
          sorting_weight: 1
      power:
        name: 'Power_5'
        id: power_5
        web_server:
          sorting_group_id: channel_5
          sorting_weight: 2
        filters:
          - multiply: ${divider_correction}
      energy:
        name: 'Energy_5'
        id: energy_5
        internal: true
        filters:
          - multiply: ${divider_correction}
    channel_6:
      current:
        name: 'Current_6'
        id: current_6
        web_server:
          sorting_group_id: channel_6
          sorting_weight: 1
      power:
        name: 'Power_6'
        id: power_6
        web_server:
          sorting_group_id: channel_6
          sorting_weight: 2
        filters:
          - multiply: ${divider_correction}
      energy:
        name: 'Energy_6'
        id: energy_6
        internal: true
        filters:
          - multiply: ${divider_correction}
    total_power:
      name: 'Total_Power'
      id: total_power
      web_server:
        sorting_group_id: mains
        sorting_weight: 3
      filters:
        - multiply: ${divider_correction}
