# Consumed energy counters on top of the BL0906 channel energy (sum of the six channels).
# The chip counters are not cleared on read and restart only with the chip itself (power loss
# or GPIO32), so they keep running across ESP reboots. The counters add what came in since the
# last reading, and the counters and those readings are kept in the CPU board FRAM, in
# fram_store_counters of features/fram.yaml, written every 10 s. Which slot holds what:
# components/pm_energy/pm_energy.h.
# Needs jxd-pm220-e1eth-base.yaml (BL0906), features/fram.yaml and features/rtc-time.yaml
# (pcf8563_time).

external_components:
  - source: ${components}
    components: [pm_energy]

# Only brings in the record types the scripts below use
pm_energy:

packages:
  # User counters, each with its own reset button
  slot1: !include {file: jxd-pm220-energy-slot.yaml, vars: {slot: "1", index: "0"}}
  slot2: !include {file: jxd-pm220-energy-slot.yaml, vars: {slot: "2", index: "1"}}
  slot3: !include {file: jxd-pm220-energy-slot.yaml, vars: {slot: "3", index: "2"}}
  # One user counter per channel, each with its own reset button
  channel1: !include {file: jxd-pm220-energy-channel.yaml, vars: {channel: "1", index: "0"}}
  channel2: !include {file: jxd-pm220-energy-channel.yaml, vars: {channel: "2", index: "1"}}
  channel3: !include {file: jxd-pm220-energy-channel.yaml, vars: {channel: "3", index: "2"}}
  channel4: !include {file: jxd-pm220-energy-channel.yaml, vars: {channel: "4", index: "3"}}
  channel5: !include {file: jxd-pm220-energy-channel.yaml, vars: {channel: "5", index: "4"}}
  channel6: !include {file: jxd-pm220-energy-channel.yaml, vars: {channel: "6", index: "5"}}

i2c_eeprom:
  # Load the counters as soon as the FRAM is up, before anything is published
  - id: !extend fram_cpu
    on_setup:
      - script.execute: energy_load

sensor:
  # Nothing goes out before the counters are loaded: a zero would look like a reset to HA
  - platform: template
    name: "Energy Today"
    id: energy_today
    web_server:
      sorting_group_id: energy
      sorting_weight: 41
    lambda: |-
      if (!id(energy_loaded))
        return {};
      return id(energy_today_wh) / 1000.0;
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 30s
  - platform: template
    name: "Energy Yesterday"
    id: energy_yesterday
    web_server:
      sorting_group_id: energy
      sorting_weight: 42
    lambda: |-
      if (!id(energy_loaded))
        return {};
      return id(energy_yesterday_wh) / 1000.0;
    unit_of_measurement: kWh
    device_class: energy
    accuracy_decimals: 3
    update_interval: 30s
  - platform: template
    name: "Energy This Month"
    id: energy_this_month
    web_server:
      sorting_group_id: energy
      sorting_weight: 43
    lambda: |-
      if (!id(energy_loaded))
        return {};
      return id(energy_month_wh) / 1000.0;
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 30s
  - platform: template
    name: "Energy Last Month"
    id: energy_last_month
    web_server:
      sorting_group_id: energy
      sorting_weight: 44
    lambda: |-
      if (!id(energy_loaded))
        return {};
      return id(energy_last_month_wh) / 1000.0;
    unit_of_measurement: kWh
    device_class: energy
    accuracy_decimals: 3
    update_interval: 30s

globals:
  # Live counters; FRAM holds the copy that survives a reboot
  - id: energy_slot_wh
    type: std::array<double, 3>
  - id: energy_slot_time
    type: std::array<uint32_t, 3>
  - id: energy_today_wh
    type: double
  - id: energy_yesterday_wh
    type: double
  - id: energy_day_key
    type: uint32_t
  - id: energy_month_wh
    type: double
  - id: energy_last_month_wh
    type: double
  - id: energy_month_key
    type: uint32_t
  - id: energy_channel_wh
    type: std::array<double, 6>
  - id: energy_channel_time
    type: std::array<uint32_t, 6>
  # Chip channel readings at the last pass, NAN while unknown
  - id: energy_chip_kwh
    type: std::array<float, 6>
    initial_value: "{NAN, NAN, NAN, NAN, NAN, NAN}"
  - id: energy_loaded
    type: bool
    initial_value: "false"

script:
  - id: energy_load
    then:
      - lambda: |-
          using namespace pm_energy;
          // The first use checks the store's superblock and formats a blank or stale store
          if (!id(fram_store_counters)->is_ready()) {
            static bool reported = false;
            if (!reported)
              ESP_LOGE("energy", "The counters store in FRAM is not available, nothing is counted");
            reported = true;
            return;
          }
          fram_store::FramSlot *counter_slots[3] = {id(fram_counter_00), id(fram_counter_01), id(fram_counter_02)};
          fram_store::FramSlot *channel_slots[6] = {id(fram_counter_04), id(fram_counter_05), id(fram_counter_06),
                                                    id(fram_counter_07), id(fram_counter_08), id(fram_counter_09)};
          std::array<CounterRecord, 3> counters;
          std::array<CounterRecord, 6> channels;
          PeriodsRecord periods;
          LoadTally tally;
          for (size_t i = 0; i < counters.size(); i++)
            tally.load(counter_slots[i], counters[i]);
          tally.load(id(fram_counter_03), periods);
          for (size_t i = 0; i < channels.size(); i++)
            tally.load(channel_slots[i], channels[i]);
          if (tally.failed != 0) {
            // Keep the FRAM untouched and try again on the next pass
            ESP_LOGW("energy", "Reading the counters from FRAM failed");
            return;
          }
          for (size_t i = 0; i < counters.size(); i++) {
            id(energy_slot_wh)[i] = counters[i].wh;
            id(energy_slot_time)[i] = counters[i].reset_time;
          }
          id(energy_today_wh) = periods.today_wh;
          id(energy_yesterday_wh) = periods.yesterday_wh;
          id(energy_day_key) = periods.day_key;
          id(energy_month_wh) = periods.month_wh;
          id(energy_last_month_wh) = periods.last_month_wh;
          id(energy_month_key) = periods.month_key;
          // A channel without its chip reading (NAN) takes the first reading after boot as the
          // new starting point
          for (size_t i = 0; i < channels.size(); i++) {
            id(energy_channel_wh)[i] = channels[i].wh;
            id(energy_channel_time)[i] = channels[i].reset_time;
            id(energy_chip_kwh)[i] = channels[i].chip_kwh;
          }
          ESP_LOGI("energy", "Counters loaded from FRAM: %u records, %u empty and starting from zero",
                   tally.loaded, tally.blank);
          id(energy_loaded) = true;

  - id: energy_save
    then:
      - lambda: |-
          if (!id(energy_loaded))
            return;
          using namespace pm_energy;
          // What each slot last took: a record that did not change is not written again
          static std::array<CounterRecord, 6> saved_channels{};
          static std::array<CounterRecord, 3> saved_counters{};
          static PeriodsRecord saved_periods{};

          // Each channel counter is saved together with the chip reading it was counted up to, so
          // the two never disagree. Every other counter was fed from those readings as well, so it
          // is saved only once all six channels are: a power cut in between then loses part of a
          // pass from the other counters instead of counting it twice.
          fram_store::FramSlot *channel_slots[6] = {id(fram_counter_04), id(fram_counter_05), id(fram_counter_06),
                                                    id(fram_counter_07), id(fram_counter_08), id(fram_counter_09)};
          bool channels_ok = true;
          for (size_t i = 0; i < saved_channels.size(); i++) {
            const auto channel =
                CounterRecord::of(id(energy_channel_wh)[i], id(energy_channel_time)[i], id(energy_chip_kwh)[i]);
            channels_ok &= save_record(channel_slots[i], channel, saved_channels[i]);
          }
          if (!channels_ok) {
            ESP_LOGW("energy", "Writing the channel counters to FRAM failed, the other counters wait for the next pass");
            return;
          }

          fram_store::FramSlot *counter_slots[3] = {id(fram_counter_00), id(fram_counter_01), id(fram_counter_02)};
          bool ok = true;
          for (size_t i = 0; i < saved_counters.size(); i++) {
            const auto counter = CounterRecord::of(id(energy_slot_wh)[i], id(energy_slot_time)[i]);
            ok &= save_record(counter_slots[i], counter, saved_counters[i]);
          }
          auto periods = PeriodsRecord::blank();
          periods.today_wh = id(energy_today_wh);
          periods.yesterday_wh = id(energy_yesterday_wh);
          periods.day_key = id(energy_day_key);
          periods.month_wh = id(energy_month_wh);
          periods.last_month_wh = id(energy_last_month_wh);
          periods.month_key = id(energy_month_key);
          ok &= save_record(id(fram_counter_03), periods, saved_periods);
          if (!ok)
            ESP_LOGW("energy", "Writing the counters to FRAM failed");

  # Factory reset, right before the reboot: formatting fram_store_counters empties every slot, so
  # the counters and the chip readings start over as on a new device; a format cut short by a
  # power loss is finished at the next boot. No save can write them back meanwhile.
  - id: energy_clear
    then:
      - lambda: |-
          id(energy_loaded) = false;
          if (!id(fram_store_counters)->format())
            ESP_LOGW("energy", "Clearing the counters in FRAM failed");

button:
  # HA presses a button without asking, so keep it off the default dashboard
  - platform: template
    name: "Reset All Energy Counters"
    id: reset_all_energy_counters
    web_server:
      sorting_group_id: energy
      sorting_weight: 50
    icon: mdi:counter
    entity_category: config
    on_press:
      - lambda: |-
          if (!id(energy_loaded))
            return;
          auto now = id(pcf8563_time).now();
          const uint32_t since = now.is_valid() ? now.timestamp : 0;
          id(energy_slot_wh).fill(0);
          id(energy_slot_time).fill(since);
          id(energy_channel_wh).fill(0);
          id(energy_channel_time).fill(since);
      - script.execute: energy_save
      - lambda: |-
          PollingComponent *counters[] = {id(energy_counter_1), id(energy_counter_1_reset_time),
                                          id(energy_counter_2), id(energy_counter_2_reset_time),
                                          id(energy_counter_3), id(energy_counter_3_reset_time),
                                          id(energy_channel_1), id(energy_channel_1_reset_time),
                                          id(energy_channel_2), id(energy_channel_2_reset_time),
                                          id(energy_channel_3), id(energy_channel_3_reset_time),
                                          id(energy_channel_4), id(energy_channel_4_reset_time),
                                          id(energy_channel_5), id(energy_channel_5_reset_time),
                                          id(energy_channel_6), id(energy_channel_6_reset_time)};
          for (auto *counter : counters)
            counter->update();

interval:
  - interval: 10s
    then:
      - lambda: |-
          if (!id(energy_loaded)) {
            id(energy_load).execute();
            if (!id(energy_loaded))
              return;
          }

          auto now = id(pcf8563_time).now();
          if (now.is_valid()) {
            const uint32_t day_key = now.year * 1000 + now.day_of_year;
            if (id(energy_day_key) != day_key) {
              auto prev = ESPTime::from_epoch_local(now.timestamp - 86400);
              const uint32_t prev_day_key = prev.year * 1000 + prev.day_of_year;
              // Yesterday is only known when the stored day really was yesterday
              id(energy_yesterday_wh) = id(energy_day_key) == prev_day_key ? id(energy_today_wh) : 0;
              id(energy_today_wh) = 0;
              id(energy_day_key) = day_key;
            }

            const uint32_t month_key = now.year * 12 + now.month - 1;
            if (id(energy_month_key) != month_key) {
              id(energy_last_month_wh) = id(energy_month_key) == month_key - 1 ? id(energy_month_wh) : 0;
              id(energy_month_wh) = 0;
              id(energy_month_key) = month_key;
            }

            // First start: user counters count from now
            for (auto &time : id(energy_slot_time)) {
              if (time == 0)
                time = now.timestamp;
            }
            for (auto &time : id(energy_channel_time)) {
              if (time == 0)
                time = now.timestamp;
            }
          }

          // Add what the chip counted since the last reading; a smaller reading means
          // the chip restarted (or its 24-bit counter wrapped) and counts from zero
          sensor::Sensor *channel[6] = {id(energy_1), id(energy_2), id(energy_3),
                                        id(energy_4), id(energy_5), id(energy_6)};
          auto &last_kwh = id(energy_chip_kwh);
          double delta_kwh = 0;
          for (int i = 0; i < 6; i++) {
            const float kwh = channel[i]->state;
            if (std::isnan(kwh))
              continue;
            if (!std::isnan(last_kwh[i])) {
              const float step = kwh >= last_kwh[i] ? kwh - last_kwh[i] : kwh;
              // 1 kWh on one channel within a pass is far beyond any real load: a corrupted
              // read or a long ESP outage. Skipping costs one pass, a bad read could cost
              // the whole chip counter.
              if (step <= 1.0f) {
                delta_kwh += step;
                id(energy_channel_wh)[i] += step * 1000.0;
              } else {
                ESP_LOGW("energy", "Channel %d jumped by %.3f kWh, not counted", i + 1, step);
              }
            }
            last_kwh[i] = kwh;
          }
          const double delta = delta_kwh * 1000;

          for (auto &slot : id(energy_slot_wh))
            slot += delta;
          id(energy_today_wh) += delta;
          id(energy_month_wh) += delta;
      - script.execute: energy_save
