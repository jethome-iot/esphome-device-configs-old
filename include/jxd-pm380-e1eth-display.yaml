# JXD-DISPLAY2 rev 1.0
# Needs jxd-r6-e1eth-buttons.yaml (joystick), jxd-d3-pm3-3.yaml (readings),
# jxd-pm380-energy.yaml (counters) and ethernet.yaml or wifi.yaml (link icon)
# in the device config.
# On the main page LEFT opens the status page, UP the energy counters, RIGHT the clock, CENTER the menu.

script:
  - id: check_blank_page
    then:
      - lambda: |-
          id(current_display_off_s) = 0;
          if (id(display1).get_active_page() == id(blank_page)) {
            id(display1).show_page(id(main_page));
          }

font:
  - file: ../fonts/7x14-mod2.bdf
    id: f7x14_mod2

  - file: ../fonts/6x12.bdf
    id: f6x12

  - file: ../fonts/5x7.bdf
    id: f5x7

  - file: ../fonts/spleen-12x24.bdf
    id: big_label_font

packages:
  status_page: !include {file: jxd-pm380-status-page.yaml, vars: {display_settings_id: display1}}
  energy_page: !include {file: jxd-pm380-energy-page.yaml, vars: {display_settings_id: display1}}
  time_page: !include {file: jxd-r6-time-page.yaml, vars: {display_settings_id: display1}}
  buttons: !include {file: jxd-pm380-e1eth-buttons.yaml, vars: {display_settings_id: display1}}
  display_off: !include {file: display-off.yaml, vars: {display_settings_id: display1}}
  status_icons: !include jxd-status-icons.yaml

display:
  - platform: ssd1306_i2c
    id: display1
    model: "SSD1306_128X64"
    address: 0x3C
    update_interval: 200ms
    pages:
      - id: main_page
        lambda: |-
          uint8_t mac[6];
          get_mac_address_raw(mac);
          // Short MAC suffix like on JXD; the device name itself gets ESPHome's 6-digit one
          std::string name = "${friendly_name}" + str_snprintf("-%02X%02X", 5, mac[4], mac[5]);

          sensor::Sensor *power[3] = {id(active_power_l1), id(active_power_l2), id(active_power_l3)};
          float total_power = NAN;
          for (auto *p : power) {
            if (!std::isnan(p->state))
              total_power = (std::isnan(total_power) ? 0 : total_power) + p->state;
          }

          const int row_size = 15;
          int y = (64 - row_size * 4) / 2;

          it.printf(0, y, id(f6x12), "%s", name.c_str());
          y += row_size;
          it.printf(0, y, id(f6x12), "IP: %s", id(ip).state.c_str());
          y += row_size;
          if (std::isnan(total_power)) {
            it.print(0, y, id(f6x12), "P: --");
          } else {
            it.printf(0, y, id(f6x12), "P: %.0f W", total_power);
          }
          y += row_size;

          // User counter #1; all counters are on the UP page
          const double kwh = id(energy_slot_wh)[0] / 1000.0;
          it.printf(0, y, id(f6x12), "E: %.*f kWh", kwh < 10000 ? 2 : 0, kwh);

          // Network link and Home Assistant icons share the bottom row, right of the energy
          // reading (84 px at most): centred on the row's cap height, off the screen edge.
          it.image(88, 45, ${link_icon});
          it.image(109, 45, ${ha_icon});

      - id: blank_page
        lambda: return;

graphical_display_menu:
  id: display_menu
  font: f7x14_mod2
  display: display1
  active: false
  fill_row: true
  shrink_label: true
  restore_page: false
  right_for_menu_enter: false
  on_redraw:
    then:
      component.update: display1
  mode: joystick
  items:
    - !include {file: jxd-pm380-phase-menu.yaml, vars: {phase: "1"}}
    - !include {file: jxd-pm380-phase-menu.yaml, vars: {phase: "2"}}
    - !include {file: jxd-pm380-phase-menu.yaml, vars: {phase: "3"}}

    # Counters from jxd-pm380-energy.yaml
    - type: menu
      text: "Energy"
      items:
        - !include {file: jxd-pm380-energy-slot-menu.yaml, vars: {slot: "1", index: "0"}}
        - !include {file: jxd-pm380-energy-slot-menu.yaml, vars: {slot: "2", index: "1"}}
        - !include {file: jxd-pm380-energy-slot-menu.yaml, vars: {slot: "3", index: "2"}}
        - type: menu
          text: "Reset all"
          items:
            - type: label
              text: "Reset all?"
            - type: command
              text: "Yes"
              on_value:
                - button.press: reset_all_energy_counters
                - display_menu.back:
        - !include {file: jxd-pm380-energy-menu-item.yaml, vars: {label: "Today", wh: "id(energy_today_wh)"}}
        - !include {file: jxd-pm380-energy-menu-item.yaml, vars: {label: "Yesterday", wh: "id(energy_yesterday_wh)"}}
        - !include {file: jxd-pm380-energy-menu-item.yaml, vars: {label: "Month", wh: "id(energy_month_wh)"}}
        - !include {file: jxd-pm380-energy-menu-item.yaml, vars: {label: "Last month", wh: "id(energy_last_month_wh)"}}

    - type: menu
      text: "Info"
      id: info_submenu
      items:
        - type: value
          text: "Freq"
          value_lambda: |-
            float v = id(line_frequency).state;
            return std::isnan(v) ? std::string("--") : str_sprintf("%.2f Hz", v);
        # ATM90E32 frequency status: "Normal", "LOW" or "HIGH"
        - type: value
          text: "Freq status"
          value_lambda: |-
            const auto &s = id(frequency_status).state;
            return s.empty() ? std::string("--") : (s == "Normal" ? std::string("OK") : s);
        - type: value
          text: "Meter"
          value_lambda: |-
            float v = id(atm90e32_temperature).state;
            return std::isnan(v) ? std::string("--") : str_sprintf("%.1f°C", v);
        - type: value
          text: "PCB"
          value_lambda: |-
            float v = id(cpu_board_temp).state;
            return std::isnan(v) ? std::string("--") : str_sprintf("%.1f°C", v);
        - type: value
          text: "VIN"
          value_lambda: |-
            float v = id(vin_voltage).state;
            return std::isnan(v) ? std::string("--") : str_sprintf("%.1f V", v);
        - type: value
          text: "PoE"
          value_lambda: |-
            float v = id(poe_voltage).state;
            return std::isnan(v) ? std::string("--") : str_sprintf("%.1f V", v);
        # Network info items are added via network-specific packages:
        # - For Ethernet: include jxd-r6-eth-menu-items.yaml

    - type: menu
      text: "Settings"
      id: menu_settings_id
      items:
        - type: menu
          text: "Display"
          items:
            - type: select
              text: "Turn off"
              select: display_off_timer_select

        - type: menu
          text: "Calibration"
          items:
            - type: menu
              text: "Ref voltage"
              items:
                - type: number
                  text: "L1"
                  number: ref_voltage_l1
                - type: number
                  text: "L2"
                  number: ref_voltage_l2
                - type: number
                  text: "L3"
                  number: ref_voltage_l3

            - type: menu
              text: "Ref current"
              items:
                - type: number
                  text: "L1"
                  number: ref_current_l1
                - type: number
                  text: "L2"
                  number: ref_current_l2
                - type: number
                  text: "L3"
                  number: ref_current_l3

            - type: menu
              text: "Gain"
              items:
                - type: command
                  text: "Run"
                  on_value:
                    - button.press: run_gain_calibration
                - type: command
                  text: "Clear"
                  on_value:
                    - button.press: clear_gain_calibration

            - type: menu
              text: "Offset"
              items:
                - type: command
                  text: "Run"
                  on_value:
                    - button.press: run_offset_calibration
                - type: command
                  text: "Clear"
                  on_value:
                    - button.press: clear_offset_calibration

            - type: menu
              text: "Power offset"
              items:
                - type: command
                  text: "Run"
                  on_value:
                    - button.press: run_power_offset_calibration
                - type: command
                  text: "Clear"
                  on_value:
                    - button.press: clear_power_offset_calibration

        - type: menu
          text: "Factory reset"
          items:
            - type: label
              text: "Factory reset?"

            - type: command
              text: "Yes"
              on_value:
                - script.execute: energy_clear
                - lambda: |-
                    global_preferences->reset();
                    App.safe_reboot();

        - type: command
          text: "Reboot device"
          on_value:
            - lambda: App.safe_reboot();
