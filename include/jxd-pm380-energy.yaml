# Consumed energy counters on top of the ATM90E32 forward active energy (sum of the phases).
# The chip's counters start from zero on every boot, so the totals are kept in the CPU board
# FRAM (fram_cpu), written every 10 s.
# Needs jxd-d3-pm3-3.yaml, fram_cpu and the pcf8563_time time source in the device config.

esphome:
  includes:
    - ../include/jxd-pm380-energy-store.h

packages:
  # User counters, each with its own reset button
  slot1: !include {file: jxd-pm380-energy-slot.yaml, vars: {slot: "1", index: "0"}}
  slot2: !include {file: jxd-pm380-energy-slot.yaml, vars: {slot: "2", index: "1"}}
  slot3: !include {file: jxd-pm380-energy-slot.yaml, vars: {slot: "3", index: "2"}}

i2c_eeprom:
  # Load the counters as soon as the FRAM is up, before anything is published
  - id: !extend fram_cpu
    on_setup:
      - script.execute: energy_load

sensor:
  # Hardware energy since boot, in Wh; only used to feed the counters below
  - id: !extend atm90e32_chip
    phase_a:
      forward_active_energy:
        id: forward_energy_l1
        internal: true
    phase_b:
      forward_active_energy:
        id: forward_energy_l2
        internal: true
    phase_c:
      forward_active_energy:
        id: forward_energy_l3
        internal: true

  # Nothing goes out before the counters are loaded: a zero would look like a reset to HA
  - platform: template
    name: "Energy Today"
    id: energy_today
    lambda: |-
      if (!id(energy_loaded))
        return {};
      return id(energy_today_wh) / 1000.0;
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 30s
  - platform: template
    name: "Energy Yesterday"
    id: energy_yesterday
    lambda: |-
      if (!id(energy_loaded))
        return {};
      return id(energy_yesterday_wh) / 1000.0;
    unit_of_measurement: kWh
    device_class: energy
    accuracy_decimals: 3
    update_interval: 30s
  - platform: template
    name: "Energy This Month"
    id: energy_this_month
    lambda: |-
      if (!id(energy_loaded))
        return {};
      return id(energy_month_wh) / 1000.0;
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 30s
  - platform: template
    name: "Energy Last Month"
    id: energy_last_month
    lambda: |-
      if (!id(energy_loaded))
        return {};
      return id(energy_last_month_wh) / 1000.0;
    unit_of_measurement: kWh
    device_class: energy
    accuracy_decimals: 3
    update_interval: 30s

globals:
  # Live counters; FRAM holds the copy that survives a reboot
  - id: energy_slot_wh
    type: std::array<double, 3>
  - id: energy_slot_time
    type: std::array<uint32_t, 3>
  - id: energy_today_wh
    type: double
  - id: energy_yesterday_wh
    type: double
  - id: energy_day_key
    type: uint32_t
  - id: energy_month_wh
    type: double
  - id: energy_last_month_wh
    type: double
  - id: energy_month_key
    type: uint32_t
  - id: energy_loaded
    type: bool
    initial_value: "false"

# EnergyStore is only the FRAM image: ESPHome adds includes after the globals,
# so the header type cannot be a global itself
script:
  - id: energy_load
    then:
      - lambda: |-
          EnergyStore stored;
          if (!id(fram_cpu)->get(ENERGY_STORE_ADDRESS, reinterpret_cast<uint8_t *>(&stored), sizeof(stored))) {
            // Keep the FRAM untouched and try again on the next pass
            ESP_LOGW("energy", "Reading the counters from FRAM failed");
            return;
          }
          if (stored.magic == ENERGY_STORE_MAGIC && stored.version == ENERGY_STORE_VERSION &&
              stored.crc == energy_store_crc(stored)) {
            id(energy_slot_wh) = stored.slot_wh;
            id(energy_slot_time) = stored.slot_time;
            id(energy_today_wh) = stored.today_wh;
            id(energy_yesterday_wh) = stored.yesterday_wh;
            id(energy_day_key) = stored.day_key;
            id(energy_month_wh) = stored.month_wh;
            id(energy_last_month_wh) = stored.last_month_wh;
            id(energy_month_key) = stored.month_key;
            ESP_LOGI("energy", "Counters loaded from FRAM");
          } else {
            ESP_LOGW("energy", "No valid counters in FRAM, starting from zero");
          }
          id(energy_loaded) = true;

  - id: energy_save
    then:
      - lambda: |-
          if (!id(energy_loaded))
            return;
          EnergyStore store{};
          store.slot_wh = id(energy_slot_wh);
          store.slot_time = id(energy_slot_time);
          store.today_wh = id(energy_today_wh);
          store.yesterday_wh = id(energy_yesterday_wh);
          store.day_key = id(energy_day_key);
          store.month_wh = id(energy_month_wh);
          store.last_month_wh = id(energy_last_month_wh);
          store.month_key = id(energy_month_key);
          store.magic = ENERGY_STORE_MAGIC;
          store.version = ENERGY_STORE_VERSION;
          store.crc = energy_store_crc(store);
          if (!id(fram_cpu)->put(ENERGY_STORE_ADDRESS, reinterpret_cast<const uint8_t *>(&store), sizeof(store)))
            ESP_LOGW("energy", "Writing the counters to FRAM failed");

interval:
  - interval: 10s
    then:
      - lambda: |-
          if (!id(energy_loaded)) {
            id(energy_load).execute();
            if (!id(energy_loaded))
              return;
          }

          auto now = id(pcf8563_time).now();
          if (now.is_valid()) {
            const uint32_t day_key = now.year * 1000 + now.day_of_year;
            if (id(energy_day_key) != day_key) {
              auto prev = ESPTime::from_epoch_local(now.timestamp - 86400);
              const uint32_t prev_day_key = prev.year * 1000 + prev.day_of_year;
              // Yesterday is only known when the stored day really was yesterday
              id(energy_yesterday_wh) = id(energy_day_key) == prev_day_key ? id(energy_today_wh) : 0;
              id(energy_today_wh) = 0;
              id(energy_day_key) = day_key;
            }

            const uint32_t month_key = now.year * 12 + now.month - 1;
            if (id(energy_month_key) != month_key) {
              id(energy_last_month_wh) = id(energy_month_key) == month_key - 1 ? id(energy_month_wh) : 0;
              id(energy_month_wh) = 0;
              id(energy_month_key) = month_key;
            }

            // First start: user counters count from now
            for (auto &time : id(energy_slot_time)) {
              if (time == 0)
                time = now.timestamp;
            }
          }

          // The chip counters are cumulative since boot; add what came in since the last pass
          static float last_wh[3] = {0, 0, 0};
          sensor::Sensor *forward[3] = {id(forward_energy_l1), id(forward_energy_l2), id(forward_energy_l3)};
          double delta = 0;
          for (int i = 0; i < 3; i++) {
            const float wh = forward[i]->state;
            if (std::isnan(wh))
              continue;
            delta += wh >= last_wh[i] ? wh - last_wh[i] : wh;
            last_wh[i] = wh;
          }

          for (auto &slot : id(energy_slot_wh))
            slot += delta;
          id(energy_today_wh) += delta;
          id(energy_month_wh) += delta;
      - script.execute: energy_save
