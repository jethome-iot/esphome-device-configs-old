display:
  - platform: ssd1306_i2c
    id: !extend ${display_settings_id}
    pages:
      - id: status_page
        lambda: |-
          const int col_right[3] = {55, 91, 127};
          const int row_height = 9;

          sensor::Sensor *voltage[3] = {id(voltage_l1), id(voltage_l2), id(voltage_l3)};
          sensor::Sensor *current[3] = {id(current_l1), id(current_l2), id(current_l3)};
          sensor::Sensor *power[3] = {id(active_power_l1), id(active_power_l2), id(active_power_l3)};
          sensor::Sensor *pf[3] = {id(power_factor_l1), id(power_factor_l2), id(power_factor_l3)};
          text_sensor::TextSensor *status[3] = {id(phase_status_l1), id(phase_status_l2), id(phase_status_l3)};

          auto has_value = [](sensor::Sensor *s) { return s->has_state() && !std::isnan(s->state); };
          auto print_row = [&](int y, const char *label, sensor::Sensor **values, int precision) {
            it.print(0, y, id(f5x7), label);
            for (int i = 0; i < 3; i++) {
              if (has_value(values[i])) {
                // Keep big currents inside the column
                int p = (precision > 1 && values[i]->state >= 100) ? 1 : precision;
                it.printf(col_right[i], y, id(f5x7), TextAlign::TOP_RIGHT, "%.*f", p, values[i]->state);
              } else {
                it.print(col_right[i], y, id(f5x7), TextAlign::TOP_RIGHT, "--");
              }
            }
          };

          // Header
          it.print(col_right[0], 0, id(f5x7), TextAlign::TOP_RIGHT, "L1");
          it.print(col_right[1], 0, id(f5x7), TextAlign::TOP_RIGHT, "L2");
          it.print(col_right[2], 0, id(f5x7), TextAlign::TOP_RIGHT, "L3");

          print_row(1 * row_height, "U,V", voltage, 1);
          print_row(2 * row_height, "I,A", current, 2);
          print_row(3 * row_height, "P,W", power, 0);
          print_row(4 * row_height, "PF", pf, 2);

          it.horizontal_line(0, 5 * row_height, it.get_width());

          // Total active power and line frequency
          float total_power = 0;
          for (auto *p : power) {
            if (has_value(p))
              total_power += p->state;
          }
          it.printf(0, 5 * row_height + 2, id(f5x7), "Sum %.0f W", total_power);
          if (has_value(id(line_frequency))) {
            it.printf(col_right[2], 5 * row_height + 2, id(f5x7), TextAlign::TOP_RIGHT, "%.2f Hz",
                      id(line_frequency).state);
          }

          // First phase that is not okay, details are in the menu
          std::string status_line = "Status: OK";
          for (int i = 0; i < 3; i++) {
            if (status[i]->has_state() && status[i]->state != "Okay") {
              status_line = str_sprintf("L%d: %s", i + 1, status[i]->state.c_str());
              break;
            }
          }
          it.print(0, 6 * row_height + 2, id(f5x7), status_line.c_str());
