# Main page status icons, 16x16 each: the network link and Home Assistant.
# The art comes from scripts/build-icons.py. The link icon's expression, `link_icon`,
# is set by ethernet.yaml or wifi.yaml, whichever the device config uses.

substitutions:
  # Home Assistant subscribes to states; a bare API client such as `esphome logs` does not count.
  ha_icon: 'api::global_api_server->is_connected_with_state_subscription() ? id(icon_ha) : id(icon_ha_off)'

image:
  - platform: file
    file: ../images/icons/ethernet.svg
    id: icon_eth
    type: BINARY

  - platform: file
    file: ../images/icons/ethernet-off.svg
    id: icon_eth_off
    type: BINARY

  - platform: file
    file: ../images/icons/wifi.svg
    id: icon_wifi
    type: BINARY

  - platform: file
    file: ../images/icons/wifi-off.svg
    id: icon_wifi_off
    type: BINARY

  - platform: file
    file: ../images/icons/ha.svg
    id: icon_ha
    type: BINARY

  - platform: file
    file: ../images/icons/ha-off.svg
    id: icon_ha_off
    type: BINARY
