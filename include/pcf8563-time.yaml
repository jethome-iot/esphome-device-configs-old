time:
# RTC PCF8563
  - platform: pcf8563
    id: pcf8563_time
    address: 0x51
    timezone: ${timezone}
    update_interval: 15min
# Getting time from ntp
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
# Time synchronization
    on_time_sync:
      then:
        pcf8563.write_time:
# No timezone here: that is what makes Home Assistant send its own,
# which ESPHome applies globally to all time sources
  - platform: homeassistant
    id: ha_time_source
    update_interval: 15min
    on_time_sync:
      # HA applies the timezone right after the time sync callback
      - delay: 1s
      - lambda: id(stored_timezone) = esphome::time::get_global_tz();

script:
  - id: setup_time
    then:
      - logger.log: 'Setup time'
      - lambda: |-
          const auto &tz = id(stored_timezone);
          if (tz.std_offset_seconds != 0 || tz.has_dst()) {
            esphome::time::set_global_tz(tz);
          }
      - pcf8563.read_time:
          id: pcf8563_time

# Home Assistant's timezone is RAM-only, keep it across reboots
globals:
  - id: stored_timezone
    type: esphome::time::ParsedTimezone
    restore_value: yes
