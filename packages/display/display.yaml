font:
  - file: fonts/7x14-mod2.bdf
    id: f7x14_mod2

  - file: fonts/6x12.bdf
    id: f6x12

  - file: fonts/5x7.bdf
    id: f5x7

  - file: fonts/spleen-12x24.bdf
    id: big_label_font

script:
  - id: check_blank_page
    then:
      - lambda: |-
          id(display_off_s) = 0;
          if (id(display1).get_active_page() == id(blank_page)) {
            id(display1).show_page(id(main_page));
          }

display:
  - platform: ssd1306_i2c
    id: display1
    model: "SH1106_128X64"
    address: 0x3C
    update_interval: 200ms
    pages:
      - id: main_page
        lambda: |-
          uint8_t mac[6];
          get_mac_address_raw(mac);
          auto str_name = "${friendly_name}-" + str_snprintf("%02X%02X", 4, mac[4], mac[5]);

          const int row_size = 15;
          int y = (64 - row_size * 4) / 2;

          it.printf(0, y, id(f6x12), "%s", str_name.c_str());
          y += row_size;
          it.printf(0, y, id(f6x12), "UP: %s", id(uptime_sensor).state.c_str());
          y += row_size;
          it.printf(0, y, id(f6x12), "VIN: %2.1fV", id(input_voltage).state);
          y += row_size;
          it.printf(0, y, id(f6x12), "IP: %s", id(ip).state.c_str());
