graphical_display_menu:
  items:
    - id: !extend info_submenu
      items:
        - type: label
          text: "IP(WiFi):"

        - type: label
          text: !lambda |-
            if (id(captive_portal_id).is_active()) {
              char buf[esphome::network::IP_ADDRESS_BUFFER_SIZE];
              return " " + std::string(id(wifi_id).wifi_soft_ap_ip().str_to(buf));
            }
            return " " + id(ip).state;

        - type: label
          text: "MAC:"

        - type: label
          text: !lambda 'return " " + id(mac_wifi).state;'

    - id: !extend menu_settings_id
      items:
        - type: menu
          text: "Reset WiFi creds"
          items:
            - type: label
              text: "Reset?"

            - type: command
              text: "Confirm"
              id: wifi_reset_yes
              on_value:
                - lambda: 'id(wifi_reset_yes)->set_text("Confirm - OK");'
                - delay: 1s
                - script.execute: reset_wifi
